---
- name: Vector | Download
  ansible.builtin.get_url:
    url: "vector_url"
    dest: "./vector-{{ vector_version }}.x86_64.rpm"
    mode: "0644"
- name: Vector | Install
  become: true
  ansible.builtin.dnf:
    name: "./vector-{{ vector_version }}.x86_64.rpm"
- name: Vector | Apply template
  ansible.builtin.template:
    src: vector.yml.j2
    dest: vector.yml
    mode: "0644"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    validate: vector validate --no-environment --config-yaml %s
- name: Vector | Change systemd unit
  become: true
  ansible.builtin.template:
    src: vector.service.j2
    dest: /etc/systemd/system/vector.service
    mode: "0644"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
- name: Pause for 10 seconds to create vector service
  ansible.builtin.pause:
    seconds: 10
  notify: Start Vector Service
- name: Flush handlers to restart vector
  ansible.builtin.meta: flush_handlers
